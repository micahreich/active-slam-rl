environment:
  pose_dim: &pose_dim 3
  action_dim: &action_dim 2
  episode_maxlen_s: 300.0
  percentage_of_map_to_explore: 0.90
  map_name: floorplan1
  og_map_resolution: 0.2
  omega: 3.0
  v: 1.0
  dt: 0.1
  travel_cut_short_dist_m: 0.1
  og_map_shape: &og_map_shape [1, 128, 128]


sac:
  discount: 0.99
  critic_tau: 0.005
  actor_update_frequency: 1
  critic_target_update_frequency: 2
  batch_size: 64
  learnable_temperature: true
  init_temperature: 0.1
  action_dim: *action_dim
  actor_lr: !!float 1e-3
  critic_lr: !!float 1e-3
  alpha_lr: !!float 1e-3

  critic:
    og_map_shape: *og_map_shape
    pose_dim: *pose_dim
    action_dim: *action_dim
    og_map_embedding_size: 128
    encoder_channels: [32, 64, 64]
    hidden_dim: 256
    hidden_depth: 2

  actor:
    og_map_shape: *og_map_shape
    pose_dim: *pose_dim
    action_dim: *action_dim
    og_map_embedding_size: 128
    encoder_channels: [32, 64, 64]
    hidden_dim: 256
    hidden_depth: 2
    log_std_bounds: [-5.0, 2.0]
    action_bounds:
      low: [-3.14159, 0.0]
      high: [3.14159, 20.0]

train:
  num_train_steps: 1_000_000
  num_seed_steps: 1_000
  replay_buffer_capacity: 100_000
  eval_frequency: 10
  num_eval_episodes: 10